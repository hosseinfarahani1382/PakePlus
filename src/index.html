function popSpecificLoginBubble(target, ev) {
    if (ev) ev.stopPropagation();
    if (state.currentUser || !target || target.dataset.popping === '1') return;
    const bg = document.getElementById('login-bubbles-bg');
    if (!bg) return;
    const bgRect = bg.getBoundingClientRect();
    const tRect = target.getBoundingClientRect();
    const cx = (tRect.left - bgRect.left) + (tRect.width / 2);
    const cy = (tRect.top - bgRect.top) + (tRect.height / 2);

    target.dataset.popping = '1';
    target.style.transition = 'opacity 0.12s ease';
    target.style.opacity = '0';

    const ring = document.createElement('div');
    ring.className = 'bubble-pop-ring';
    ring.style.left = cx + 'px';
    ring.style.top = cy + 'px';
    ring.style.width = tRect.width + 'px';
    ring.style.height = tRect.height + 'px';
    bg.appendChild(ring);
    setTimeout(() => ring.remove(), 600);

    // Spawn 7 mini CHF bubbles that burst out & fall down!
    const miniCount = 7;
    for (let i = 0; i < miniCount; i++) {
        const mb = document.createElement('div');
        mb.className = 'mini-chf-bubble';
        const mbSize = Math.round(16 + Math.random() * 10);
        const angle = (Math.PI * 2 * i) / miniCount + (Math.random() * 0.4 - 0.2);
        const dist = 26 + Math.random() * 44;
        const mx = Math.cos(angle) * dist;
        const my = Math.sin(angle) * dist - 16;
        const mdur = (1.25 + Math.random() * 0.55).toFixed(2) + 's';
        mb.style.left = cx + 'px';
        mb.style.top = cy + 'px';
        mb.style.width = mbSize + 'px';
        mb.style.height = mbSize + 'px';
        mb.style.setProperty('--mx', mx.toFixed(1) + 'px');
        mb.style.setProperty('--my', my.toFixed(1) + 'px');
        mb.style.setProperty('--mdur', mdur);
        mb.innerHTML = getChfOfficialLogoSvg(Math.round(mbSize * 0.74), 'opacity:0.95;box-shadow:none;');
        bg.appendChild(mb);
        setTimeout(() => mb.remove(), 1950);
    }

    // Plus glowing droplets
    const colors = ['#7dd3fc', '#38bdf8', '#e0f2fe', '#ffffff', '#facc15'];
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'bubble-particle';
        const angle = (Math.PI * 2 * i) / 12 + (Math.random() * 0.35 - 0.17);
        const dist = 22 + Math.random() * 42;
        const px = Math.cos(angle) * dist;
        const py = Math.sin(angle) * dist - 10;
        const pSize = 2.5 + Math.random() * 3.5;
        const dur = (0.9 + Math.random() * 0.45).toFixed(2) + 's';
        const col = colors[i % colors.length];
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.width = pSize + 'px';
        p.style.height = pSize + 'px';
        p.style.background = col;
        p.style.boxShadow = `0 0 6px ${col}`;
        p.style.setProperty('--px', px.toFixed(1) + 'px');
        p.style.setProperty('--py', py.toFixed(1) + 'px');
        p.style.setProperty('--pdur', dur);
        bg.appendChild(p);
        setTimeout(() => p.remove(), 1500);
    }

    setTimeout(() => {
        if (target && target.isConnected) {
            target.style.opacity = '';
            delete target.dataset.popping;
        }
    }, 2200);
}

function popRandomLoginBubble() {
    if (state.currentUser) return;
    const bg = document.getElementById('login-bubbles-bg');
    if (!bg) return;
    const bgRect = bg.getBoundingClientRect();
    const bubbles = Array.from(bg.querySelectorAll('.login-bubble')).filter(el => {
        if (el.dataset.popping === '1') return false;
        const r = el.getBoundingClientRect();
        return r.top > bgRect.top + 40 && r.bottom < bgRect.bottom - 50;
    });
    if (bubbles.length === 0) return;
    const target = bubbles[Math.floor(Math.random() * bubbles.length)];
    popSpecificLoginBubble(target);
}

function startLoginBubblePopLoop() {
    if (_loginBubblePopInterval) return;
    _loginBubbleInitialTimeout = setTimeout(() => {
        popRandomLoginBubble();
        if (Math.random() > 0.35) setTimeout(popRandomLoginBubble, 550);
    }, 2500);
    _loginBubblePopInterval = setInterval(() => {
        const howMany = Math.random() < 0.5 ? 1 : 2;
        popRandomLoginBubble();
        if (howMany === 2) {
            setTimeout(() => popRandomLoginBubble(), 400 + Math.floor(Math.random() * 900));
        }
    }, 15000);
}

let onlineUsersMap = loadFromStorage('chf_online_presence_v41', {});


function markUserPresence(name, status = 'online', ts = Date.now()) {
    if (!name) return;
    const key = normalizeFa(name);
    if (!key) return;
    onlineUsersMap[key] = { name, status, lastSeenTs: Number(ts) || Date.now() };
    saveToStorage('chf_online_presence_v41', onlineUsersMap);
}


function isUserCurrentlyOnline(userObj) {
    if (!userObj || !userObj.name) return false;
    if (state.currentUser && normalizeFa(state.currentUser.name) === normalizeFa(userObj.name)) return true;
    const entry = onlineUsersMap[normalizeFa(userObj.name)];
    if (!entry || entry.status === 'offline') return false;
    return (Date.now() - (Number(entry.lastSeenTs) || 0)) <= 90000;
}


function broadcastMyPresence(status = 'online') {
    if (!state.currentUser || !state.currentUser.name) return;
    const ts = Date.now();
    markUserPresence(state.currentUser.name, status, ts);
    publishLiveEvent('presence', { name: state.currentUser.name, status, ts });
}

}, 25000);

let _ntfySse = null;
function startRealtimeSseStream() {
    if (typeof EventSource === 'undefined') return;
    try {
        if (_ntfySse) { try { _ntfySse.close(); } catch(_) {} _ntfySse = null; }
        _ntfySse = new EventSource(`${getActiveNtfyTopicUrl()}/sse?since=2m`);
        _ntfySse.onopen = () => {
            _ntfySseConnected = true;
            if (state.currentUser) broadcastMyPresence('online');
            _sessionNtfyBootstrapped = true;
            syncDiagnostics.ntfyOk = true;
            syncDiagnostics.ntfyStatusText = 'گذرگاه زنده بلادرنگ متصل و پایدار (SSE فعال)';
            syncDiagnostics.ntfyError = '';
            updateServerStatus(true);
        };
        _ntfySse.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.id) {
                    lastNtfyEventId = msg.id;
                    saveToStorage('chf_last_ntfy_id_v22', lastNtfyEventId);
                }
                if (msg.event === 'message' && msg.message) {
                    const evt = JSON.parse(msg.message);
                    if (applyIncomingDeltaEvent(evt)) {
                        if (!isUserInteracting()) {
                            if (state.activeTab === 'customers' && document.getElementById('cust-cards-container')) {
                                liveFilterCustomers(state.searchTerm);
                            } else {
                                render();
                            }
                        }
                    }
                }
            } catch (_) {}
        };
        _ntfySse.onerror = () => {
            _ntfySseConnected = false;
            syncDiagnostics.ntfyStatusText = 'گذرگاه زنده در حالت همگام‌سازی هوشمند...';
        };
    } catch (_) {}
}

function convertPersianDigitsToEnglish(str) {
    if (!str) return '';
    const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    let res = str.toString();
    for (let i = 0; i < 10; i++) {
        res = res.split(fa[i]).join(i.toString()).split(ar[i]).join(i.toString());
    }
    return res.replace(/\D/g, '');
}

    if (errBox) { errBox.style.display = 'none'; errBox.innerText = ''; }

    const passDigits = convertPersianDigitsToEnglish(passInput.value.trim());








    if (!username) {
        if (errBox) { errBox.innerText = "لطفاً ابتدا نام کاربری خود را انتخاب کنید!"; errBox.style.display = 'block'; }

        passInput.focus();
        return;
    }








    const normUser = normalizeFa(username);
    const foundUser = USERS.find(u => normalizeFa(u.name) === normUser);








    if (foundUser) {
        const isPassCorrect = foundUser.phones.some(p => {
            const cleanP = convertPersianDigitsToEnglish(p);
            return cleanP === passDigits || (cleanP.length >= 10 && passDigits.length >= 10 && (cleanP.endsWith(passDigits) || passDigits.endsWith(cleanP)));
        });








        if (!isPassCorrect) {
            const errMsg = "رمز عبور (شماره همراه) وارد شده برای " + foundUser.name + " اشتباه است!";

        // ورود آنی به سامانه، ثبت فوری در لاگ همگانی (بدون بازنویسی داده‌های ابر با کش قدیمی) و همگام‌سازی کامل
        state.currentUser = normalizeUserRecord(foundUser);

        // دریافت توکن JWT و همگام‌سازی در پس‌زمینه بدون قفل کردن کاربر
        apiRequest('/auth/login', 'POST', { fullName: username, phoneNumber: passDigits }, 4500)
            .then(data => {
                if (data && data.token) {
                    authToken = data.token;
                    localStorage.setItem('chf_auth_token', authToken);
                    if (data.user && data.user.id && state.currentUser) {
                        state.currentUser.id = data.user.id;
                        saveToStorage('chf_current_user', state.currentUser);
                    }
                }
                forceSyncNow();
            })
            .catch(() => {
                forceSyncNow();
            });
        return;
    }








    try {
        const data = await apiRequest('/auth/login', 'POST', { fullName: username, phoneNumber: passDigits }, 5000);
        if (data && data.token) {
            authToken = data.token;
            localStorage.setItem('chf_auth_token', authToken);

function normalizeFa(text) {
    if (!text) return '';
    return text.toString().toLowerCase()
        .replace(/ي/g, 'ی')
        .replace(/ك/g, 'ک')
        .replace(/[\u200B\u200C\u200D\uFEFF]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}

function handleCustomerLiveSearch(query) {
    const box = document.getElementById('cust-search-results');
    if (!box) return;
    const rawQ = (query || '').trim();
    const q = normalizeFa(rawQ);
    
    if (!q) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
    }




    const qDigits = rawQ.replace(/\D/g, '');




    const matches = state.customers.filter(c => {
        const nameNorm = normalizeFa(c.name);
        const cityNorm = normalizeFa(c.city);
        const codeNorm = normalizeFa(c.code);
        
        const matchText = nameNorm.includes(q) || cityNorm.includes(q) || codeNorm.includes(q);
        const matchPhone = (qDigits.length >= 2) && c.phone && c.phone.replace(/\D/g, '').includes(qDigits);




        return matchText || matchPhone;
    }).slice(0, 8);




    if (matches.length === 0) {
        box.innerHTML = '<div style="padding:10px 12px;font-size:11px;color:#94a3b8;text-align:center;">مخاطبی با عبارت «' + rawQ + '» یافت نشد (می‌توانید آزادانه نام دلخواه وارد کنید)</div>';
        box.style.display = 'block';
        return;
    }




    let itemsHtml = '';
    matches.forEach(c => {
        const isAhangari = c.name.includes("آهنگری");
        itemsHtml += '<div onclick="selectSearchedCustomer(\'' + c.code + '\')" style="padding:9px 12px;border-bottom:1px solid #1e293b;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:0.15s;" onmouseover="this.style.background=\'rgba(56,189,248,0.2)\'" onmouseout="this.style.background=\'transparent\'">' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
                '<span style="font-family:monospace;font-size:10px;font-weight:bold;color:#38bdf8;background:rgba(56,189,248,0.12);padding:1px 5px;border-radius:4px;">' + c.code + '</span>' +
                '<span style="font-size:12px;font-weight:bold;color:' + (isAhangari ? '#f59e0b' : '#fff') + ';">' + c.name + '</span>' +
                '<span style="font-size:10px;color:#fbbf24;">(' + c.city + ')</span>' +
            '</div>' +
            '<div class="ltr-phone" style="font-size:10px;color:#34d399;">' + (c.phone || '') + '</div>' +
        '</div>';
    });




    box.innerHTML = itemsHtml;
    box.style.display = 'block';
}

function filterCustomersList(allCustomers, searchTerm, cityFilter, colorFilter, senderFilter) {
    const q = normalizeFa(searchTerm || '');
    const qDigits = (searchTerm || '').replace(/\D/g, '');
    const cFilter = cityFilter || 'همه';
    const colFilter = colorFilter || 'همه';
    const sndFilter = senderFilter || 'همه';




    return sortCustomersAlphabetically(allCustomers).filter(c => {
        const mCity = (cFilter === 'همه') || (c.city && c.city.includes(cFilter));
        if (!mCity) return false;




        const cColor = c.accountColor || 'normal';
        const mColor = (colFilter === 'همه') || (cColor === colFilter);
        if (!mColor) return false;




        const cSender = c.sender || '';
        if (sndFilter === 'نامشخص') {
            if (cSender) return false;
        } else if (sndFilter !== 'همه') {
            if (cSender !== sndFilter) return false;
        }




        if (!q) return true;




        const nameNorm = normalizeFa(c.name);
        const cityNorm = normalizeFa(c.city);
        const codeNorm = normalizeFa(c.code);
        const senderNorm = normalizeFa(cSender);
        const colorMeta = getCustomerColorMeta(cColor);
        const colorNorm = normalizeFa(colorMeta.label);
        const matchText = nameNorm.includes(q) || cityNorm.includes(q) || codeNorm.includes(q) || senderNorm.includes(q) || colorNorm.includes(q);
        const matchPhone = (qDigits.length >= 2) && c.phone && c.phone.replace(/\D/g, '').includes(qDigits);




        return matchText || matchPhone;
    });
}

function markShipmentDone(idx) {
    const s = state.shipments[idx];
    if (!s) return;








    beginMutationLock(4500);
    if (s._moveTimer) clearTimeout(s._moveTimer);
    if (s._blastTimer) clearTimeout(s._blastTimer);








    s._phase = 'toDest';
    s._exploding = false;
    render();








    s._moveTimer = setTimeout(() => {
        s._moveTimer = null;
        s._phase = 'exploding';
        s._exploding = true;
        playExplosionSound();
        render();








        s._blastTimer = setTimeout(async () => {
            s._phase = null;
            s._exploding = false;
            s._blastTimer = null;
            const timeNow = getLivePersianDate();
            const newStatus = `تکمیل و ارسال (${timeNow})`;
            s.status = newStatus;
            recordShipEdit(s);
            saveToStorage('chf_shipments', state.shipments);
            publishLiveEvent('ship_upsert', { ...s });
            pushRealtimeMasterSnapshot();
            render();








            try {
                if (typeof s.id === 'number') {
                    await apiRequest(`/shipments/${s.id}/status`, 'PATCH', newStatus);
                    markShipSynced(s);
                }
            } catch(e) {
            } finally {
                endMutationLock(1500);
            }
            addLog(`✅ تکمیل و ارسال مرسوله ${s.name} (${s.code}) در ${timeNow}`);
            chfToast(`🚛 مرسوله «${s.name}» تکمیل و به مقصد ارسال شد.`, '#10b981');
        }, 1600);
    }, 950);
}








async function resetShipmentRoute(idx) {
    const s = state.shipments[idx];
    if (!s) return;
    beginMutationLock(4000);
    if (s._moveTimer) { clearTimeout(s._moveTimer); s._moveTimer = null; }
    if (s._blastTimer) { clearTimeout(s._blastTimer); s._blastTimer = null; }
    s._phase = null;
    s._exploding = false;
    const newStatus = s.carrier && s.carrier.includes('تهران') ? 'ارسال تهران' : 'در حال ارسال';
    s.status = newStatus;
    recordShipEdit(s);
    saveToStorage('chf_shipments', state.shipments);
    publishLiveEvent('ship_upsert', { ...s });
    pushRealtimeMasterSnapshot();
    addLog(`🔄 بازنشانی وضعیت ارسال مرسوله «${s.name}» (${s.code})`);
    render();
    chfToast(`🔄 وضعیت مرسوله «${s.name}» به در حال ارسال بازنشانی شد.`, '#38bdf8');
    try {
        if (typeof s.id === 'number') {
            await apiRequest(`/shipments/${s.id}/status`, 'PATCH', newStatus);
            markShipSynced(s);
        }
    } catch(e) {
    } finally {
        endMutationLock(1500);
    }
}








function removeShipment(idx) {
    const s = state.shipments[idx];
    if (!s) return;
    chfConfirm("آیا از حذف سفارش " + s.name + " اطمینان دارید؟ اقلام کسرشده به موجودی انبار بازگردانده می‌شوند.", async () => {
        beginMutationLock(5000);
        restoreRollsToInventory(s.deducts);
        recordShipDelete(s);
        state.shipments.splice(idx, 1);
        saveToStorage('chf_shipments', state.shipments);
        publishLiveEvent('ship_delete', { id: s.id, trackingCode: s.trackingCode || '' });
        if (s.deducts) {

async function saveNewShipment() {
    const nameInput = document.getElementById('ship-name').value.trim();
    const phone = document.getElementById('ship-phone').value.trim();
    const senderVal = getSenderFieldValue('ship');
    const batchNumber = (document.getElementById('ship-batch')?.value || '').trim();
    let items = document.getElementById('ship-items').value.trim();
    const carrierVal = getCarrierFieldValue('ship');
    
    const q215 = parseInt(document.getElementById('qty-215').value) || 0;
    const q185 = parseInt(document.getElementById('qty-185').value) || 0;
    const qGlass = parseInt(document.getElementById('qty-glass').value) || 0;
    const qMatt = parseInt(document.getElementById('qty-matt').value) || 0;
    const qDia = parseInt(document.getElementById('qty-diamond').value) || 0;
    
    const qM215 = parseFloat(document.getElementById('qty-m-215').value) || 0;
    const qM185 = parseFloat(document.getElementById('qty-m-185').value) || 0;
    const qMMatt = parseFloat(document.getElementById('qty-m-matt').value) || 0;
    const qMGlass = parseFloat(document.getElementById('qty-m-glass').value) || 0;








    if (!nameInput) {
        alert("نام گیرنده الزامی است!");
        return;
    }








    const deducts = {};
    const rollSummary = [];
    const shipmentItems = [];
    let hasMeters = false;
    let hasFullRolls = false;








    function checkAndAddItem(sku, qty, isMeter = false) {
        if (qty > 0) {
            deducts[sku] = qty;
            if (isMeter) hasMeters = true; else hasFullRolls = true;
            const p = state.inventory.find(inv => inv.sku === sku);
            if (p) {
                if (p.id) shipmentItems.push({ productId: p.id, quantity: qty });
                rollSummary.push(`${qty} ${p.unit || (isMeter ? 'متر' : 'عدد')} ${p.name}`);
            } else {
                rollSummary.push(`${qty} ${isMeter ? 'متر' : 'عدد'} ${sku}`);
            }
        }
    }








    checkAndAddItem("CHF-215", q215, false);
    checkAndAddItem("CHF-185", q185, false);
    checkAndAddItem("CHF-GLASS", qGlass, false);
    checkAndAddItem("CHF-MATT", qMatt, false);
    checkAndAddItem("CHF-DIAMOND", qDia, false);
    checkAndAddItem("CHF-215-M", qM215, true);
    checkAndAddItem("CHF-185-M", qM185, true);
    checkAndAddItem("CHF-MATT-M", qMMatt, true);
    checkAndAddItem("CHF-GLASS-M", qMGlass, true);








    for (const [sku, qty] of Object.entries(deducts)) {
        const product = state.inventory.find(x => x.sku === sku);
        if (!product) { alert(`کالای ${sku} در فهرست انبار وجود ندارد.`); return; }
        if (!Number.isFinite(Number(qty)) || Number(qty) <= 0 || Number(product.qty) < Number(qty)) {
            alert(`موجودی ${product.name} کافی نیست. موجودی فعلی: ${product.qty} ${product.unit}`); return;
        }
    }








    if (!items) {
        if (hasMeters && !hasFullRolls) {
            items = "یک عدد بسته طولی متری (" + rollSummary.join(' + ') + ")";
        } else if (rollSummary.length > 0) {
            items = rollSummary.join(' + ');
        } else {
            items = "۱ بسته طولی";
        }
    } else if (rollSummary.length > 0 && !items.includes(rollSummary[0])) {
        items = items + ' (' + rollSummary.join(' + ') + ')';
    }








    beginMutationLock(7000);








    // کسر فوری از موجودی انبار روی صفحه
    for (const [sku, qty] of Object.entries(deducts)) {
        deductRollsFromInventory(sku, qty);
    }








    let carrierEnum = 0;
    if (carrierVal.includes('اختصاصی')) carrierEnum = 1;
    else if (carrierVal.includes('حضوری')) carrierEnum = 2;








    let cust = state.customers.find(c => nameInput.includes(c.name) || (phone && c.phone && c.phone.includes(phone)));








    const tempTracking = 'SH-' + Date.now().toString().slice(-4);
    if (cust && senderVal && !cust.sender) {
        cust.sender = senderVal;
        recordCustEdit(cust);
        saveToStorage('chf_customers', state.customers);
        publishLiveEvent('cust_upsert', { ...cust });
    }




    const newSh = {
        id: tempTracking,
        code: cust ? cust.code : ('CHF-' + (state.shipments.length + 101)),
        name: nameInput,
        phone: phone,
        sender: senderVal,
        batchNumber: batchNumber,
        items: batchNumber ? `${items} [بچ: ${batchNumber}]` : items,
        carrier: carrierVal,
        status: carrierVal.includes('تهران') ? 'ارسال تهران' : 'در حال ارسال',
        deducts: deducts
    };








    newSh.trackingCode = tempTracking;
    recordShipEdit(newSh);
    state.shipments.push(newSh);
    chfToast(`✅ سفارش «${nameInput}» ثبت و از موجودی انبار کسر شد.`, '#10b981');
    saveToStorage('chf_shipments', state.shipments);
    state.showNewShipmentModal = false;
    render();
    addLog('➕ ثبت سفارش جدید برای «' + nameInput + '» (' + items + ') و کسر از انبار', true);
    publishLiveEvent('ship_upsert', { ...newSh });
    Object.keys(deducts).forEach(sku => {
        const prod = state.inventory.find(x => x.sku === sku);
        if (prod) publishLiveEvent('prod_upsert', { ...prod });
    });
    pushRealtimeMasterSnapshot();








    try {
        if (!cust || !cust.id) {
            const cleanName = nameInput.replace(/\(.*?\)/g, '').trim() || nameInput;
            const cityMatch = nameInput.match(/\((.*?)\)/);
            const newCode = cust ? cust.code : ('CHF-' + (state.customers.length + 101));
            const createdCust = await apiRequest('/customers', 'POST', {
                code: newCode,
                name: cleanName,
                phone,
                city: cityMatch ? cityMatch[1].trim() : (carrierVal.includes('تهران') ? 'تهران' : 'شهرستان'),
                note: items
            });
            if (createdCust && createdCust.id) {
                if (cust) {
                    cust.id = createdCust.id;
                } else {
                    cust = { id: createdCust.id, code: createdCust.code || newCode, name: createdCust.name || cleanName, phone: createdCust.phone || phone, city: createdCust.city || '', note: items };
                    state.customers.unshift(cust);
                }
                saveToStorage('chf_customers', state.customers);
            }
        }
        if (cust && cust.id) {
            const createdShip = await apiRequest('/shipments', 'POST', {
                trackingCode: tempTracking,
                customerId: cust.id,
                carrier: carrierEnum,
                itemsSummary: items,
                status: newSh.status,
                items: shipmentItems
            });
            if (createdShip && createdShip.id != null) {
                markShipSynced(tempTracking);
                newSh.id = createdShip.id;
                newSh.trackingCode = tempTracking;
                newSh.raw = createdShip;
                Object.keys(deducts).forEach(sku => markProdSynced(sku));
                saveToStorage('chf_shipments', state.shipments);
            }
        }
    } catch(e) {
        console.warn('ذخیره سفارش در سرور با تاخیر مواجه شد؛ در حافظه دستگاه ثبت گردید:', e);
    } finally {
        endMutationLock(2000);
    }
}

async function saveDynamicInventoryEdits() {

    const updates = [];
    for (let idx = 0; idx < state.inventory.length; idx++) {
        const it = state.inventory[idx];
        const inp = document.getElementById(`edit-inv-dyn-${idx}`);
        if (inp) {
            const val = parseFloat(inp.value);

                const formattedVal = Number(val.toFixed(2));
                if (formattedVal !== it.qty) {
                    it.qty = formattedVal;
                    updateItemStatus(it);
                    recordProdEdit(it);
                    if (it.id) {
                        updates.push(apiRequest(`/products/${it.id}`, 'PUT', {
                            id: it.id,
                            sku: it.sku,
                            name: it.name,
                            qty: formattedVal,
                            unit: it.unit,
                            minAlertQty: 3
                        }).then(() => markProdSynced(it.sku)));
                    } else {
                        updates.push(apiRequest('/products', 'POST', {
                            sku: it.sku,
                            name: it.name,
                            qty: formattedVal,
                            unit: it.unit,
                            minAlertQty: 3
                        }).then(created => {
                            if (created && created.id) it.id = created.id;
                            markProdSynced(it.sku);
                        }));
                    }
                }
            }
        }
    }








    const newTotal = state.inventory.filter(i => !i.sku.includes('-M') && i.unit !== 'متر').reduce((a, b) => a + b.qty, 0);
    chfToast(`✅ موجودی محصولات انبار بروزرسانی شد (جمع رول: ${newTotal} عدد).`, '#10b981');

    render();
    addLog(`✏️ اصلاح سریع موجودی محصولات انبار (جمع کل رول کامل: ${newTotal} عدد)`, true);
    publishLiveEvent('bulk_inventory', { items: state.inventory });
    pushRealtimeMasterSnapshot(true);








    try {
        await Promise.allSettled(updates);
    } finally {
        endMutationLock(2000);
    }
}

// ===== قابلیت همگام‌سازی ابری با تولید کد ۶ رقمی (سازگار با AppCreator24) =====
async function uploadToCloud() {
    const statusDiv = document.getElementById('sync-upload-status');
    if (!statusDiv) return;
    statusDiv.innerText = "⏳ در حال رمزنگاری و آپلود پایدار...";
    statusDiv.style.color = "#38bdf8";


    const code = Math.floor(100000 + Math.random() * 900000).toString();
    const payloadObj = {
        ts: Date.now(),
        code: code,
        inventory: state.inventory,
        shipments: state.shipments,
        customers: state.customers,
        archives: state.archives,
        history: state.history.slice(0, 200),
        supplies: state.supplies,
        users: USERS
    };
    const payload = JSON.stringify(payloadObj);


    // ۱. ذخیره در کش محلی دستگاه برای دسترسی آنی
    saveToStorage('chf_cloud_code_' + code, payloadObj);


    let uploadedOk = false;


    // ۲. ارسال به کانال اختصاصی یکتا برای هر کد ۶ رقمی (بدون تداخل ترافیک و بدون خطای 429)
    try {
        const resNtfy = await fetch(`https://ntfy.sh/CHF_SYNC_CODE_V43_${code}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: payload
        });
        if (resNtfy.ok) uploadedOk = true;
    } catch (_) {}


    // ۳. ارسال به مخزن ابری kvdb همراه با چرخش خودکار باکت در صورت خطای 429 یا 404
    try {
        let resKv = await fetch(`https://kvdb.io/${REALTIME_CLOUD_BUCKET_ID}/CHF_${code}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: payload
        });
        if (resKv.status === 429 || resKv.status === 404) {
            const newBucket = await ensureValidKvdbBucket();
            if (newBucket) {
                resKv = await fetch(`https://kvdb.io/${newBucket}/CHF_${code}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: payload
                });
            }
        }
        if (resKv.ok) uploadedOk = true;
    } catch (_) {}


    // ۴. تلاش پشتیبان در صورت محدودیت موقت شبکه
    if (!uploadedOk) {
        try {
            await new Promise(r => setTimeout(r, 900));
            const resBackup = await fetch(`https://ntfy.sh/CHF_BACKUP_CODE_V43_${code}`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                body: payload
            });
            if (resBackup.ok) uploadedOk = true;
        } catch (_) {}
    }


    if (uploadedOk) {
        statusDiv.innerText = "✅ کد دریافت شما: " + code;
        statusDiv.style.color = "#10b981";
        addLog(`☁️ آپلود ابری پایگاه داده و تولید کد همگام‌سازی (${code})`);
        chfToast(`☁️ آپلود ابری با موفقیت انجام شد — کد شما: ${code}`, '#10b981');
    } else {
        statusDiv.innerText = "📌 کد همگام‌سازی شما: " + code;
        statusDiv.style.color = "#facc15";
        addLog(`☁️ تولید کد همگام‌سازی (${code})`);
        chfToast(`📌 کد همگام‌سازی ${code} آماده شد.`, '#f59e0b');
    }
}


async function downloadFromCloud() {
    const rawCode = (document.getElementById('sync-download-code')?.value || '').trim();
    const codeInp = convertPersianDigitsToEnglish(rawCode);
    if (codeInp.length !== 6) {
        chfToast("⚠️ لطفاً یک کد ۶ رقمی معتبر وارد کنید.", "#f43f5e");
        return;
    }


    const btn = document.getElementById('dl-btn');
    if (btn) btn.innerText = "⏳ در حال دریافت پایدار...";


    let downloadedData = null;


    // ۱. بررسی کانال اختصاصی اول و دوم در ntfy.sh (کاملاً مقاوم در برابر خطای 429)
    const ntfyCodeUrls = [
        `https://ntfy.sh/CHF_SYNC_CODE_V43_${codeInp}/json?poll=1&since=48h&_t=${Date.now()}`,
        `https://ntfy.sh/CHF_BACKUP_CODE_V43_${codeInp}/json?poll=1&since=48h&_t=${Date.now()}`
    ];
    for (const u of ntfyCodeUrls) {
        if (downloadedData) break;
        try {
            const resNtfy = await fetch(u, { method: 'GET', cache: 'no-store' });
            if (resNtfy.ok) {
                const txt = (await resNtfy.text()).trim();
                if (txt) {
                    const lines = txt.split('\n');
                    for (let i = lines.length - 1; i >= 0; i--) {
                        try {
                            const msg = JSON.parse(lines[i]);
                            if (msg && msg.message) {
                                const parsed = JSON.parse(msg.message);
                                if (parsed && Array.isArray(parsed.inventory)) {
                                    downloadedData = parsed;
                                    break;
                                }
                            }
                        } catch (_) {}
                    }
                }
            }
        } catch (_) {}
    }


    // ۲. بررسی مخزن ابری kvdb.io
    if (!downloadedData) {
        try {
            const resKv = await fetch(`https://kvdb.io/${REALTIME_CLOUD_BUCKET_ID}/CHF_${codeInp}?_t=${Date.now()}`, {
                method: 'GET',
                cache: 'no-store'
            });
            if (resKv.ok) {
                const parsed = await resKv.json();
                if (parsed && Array.isArray(parsed.inventory)) {
                    downloadedData = parsed;
                }
            }
        } catch (_) {}
    }


    // ۳. بررسی کش محلی دستگاه
    if (!downloadedData) {
        const localCached = loadFromStorage('chf_cloud_code_' + codeInp, null);
        if (localCached && Array.isArray(localCached.inventory)) {
            downloadedData = localCached;
        }
    }


    if (btn) btn.innerText = "📥 دانلود اطلاعات";


    if (!downloadedData) {
        chfToast("❌ کد ۶ رقمی یافت نشد یا منقضی شده است.", "#f43f5e");
        return;
    }


    chfConfirm(
        `آیا از جایگزینی تمام اطلاعات این دستگاه با اطلاعات کد همگام‌سازی (${codeInp}) اطمینان دارید؟`,
        () => {
            beginMutationLock(8000);
            state.inventory = downloadedData.inventory;
            state.shipments = downloadedData.shipments || [];
            state.customers = downloadedData.customers || state.customers;
            state.archives = downloadedData.archives || [];
            if (Array.isArray(downloadedData.history)) {
                mergeHistoryLogs(downloadedData.history);
            }
            if (Array.isArray(downloadedData.supplies)) {
                state.supplies = downloadedData.supplies;
            }
            if (Array.isArray(downloadedData.users) && downloadedData.users.length > 0) {
                USERS = downloadedData.users.map(normalizeUserRecord);
                saveToStorage('chf_users_v24', USERS);
            }


            clearAllPendingState();
            syncAllToLocalStorage();
            pushRealtimeMasterSnapshot(true);
            addLog(`📥 دانلود و جایگزینی دیتابیس با کد ۶ رقمی (${codeInp})`);
            render();
            chfToast(`✅ اطلاعات با کد ${codeInp} با موفقیت دانلود و همگام‌سازی شد.`, "#10b981");
            endMutationLock(2000);
        },
        {
            title: "📥 تأیید دریافت و جایگزینی اطلاعات",
            titleColor: "#38bdf8",
            borderColor: "#38bdf8",
            okText: "بله، جایگزین شود",
            okBg: "#0284c7"
        }
    );
}

function saveManagedUser() {
    if (!hasPerm(state.currentUser, 'manageUsers')) {
        alert('دسترسی به بخش مدیریت فقط برای حسین و یاسین مجاز است!');
        return;
    }
    const name = (document.getElementById('um-name').value || '').trim();
    const role = (document.getElementById('um-role').value || '').trim() || 'پرسنل';
    const pass = convertPersianDigitsToEnglish((document.getElementById('um-pass').value || '').trim());
    const avatar = document.getElementById('um-avatar').value || 'باب اسفنجی';
    const customImage = window._umTempCustomImg || '';
    if (!name || !pass) {
        alert('نام کاربر و رمز عبور (شماره همراه) الزامی است!');
        return;
    }
    const permissions = {};
    ['inventory','shipments','archives','customers','history','print','sync'].forEach(k => {
        const el = document.getElementById('perm-' + k);
        permissions[k] = el ? el.checked : true;
    });
    permissions.manageUsers = isManagerAdmin({ name });




    permissions.history = true;
    clearTombstone('users', normalizeFa(name));
    const existingIdx = USERS.findIndex(x => normalizeFa(x.name) === normalizeFa(name));
    if (existingIdx >= 0) {
        USERS[existingIdx] = normalizeUserRecord({
            ...USERS[existingIdx],
            name, role, avatar, customImage,
            phones: [pass, ...(USERS[existingIdx].phones || []).filter(p => p !== pass)],
            permissions
        });
    } else {
        const maxId = USERS.reduce((m, x) => Math.max(m, Number(x.id) || 0), 6);
        USERS.push(normalizeUserRecord({ id: maxId + 1, name, role, avatar, customImage, phones: [pass], permissions }));
    }
    window._umTempCustomImg = '';
    saveToStorage('chf_users_v24', USERS);
    publishLiveEvent('users_sync', { users: USERS });
    pushRealtimeMasterSnapshot();
    addLog(`👤 تعریف/ویرایش کاربر «${name} (${getHeaderRoleLabel({ name, role })})» با پروفایل ${customImage ? 'تصویر دلخواه' : avatar}`);
    render();
    chfToast(`✅ کاربر «${name} (${getHeaderRoleLabel({ name, role })})» ذخیره و همگام‌سازی شد.`, '#10b981');
}

function exportCustomersToExcel() {
    const sorted = sortCustomersAlphabetically(state.customers);
    let rows = '';
    sorted.forEach((c, i) => {
        const meta = getCustomerColorMeta(c.accountColor);
        const statusText = meta.badgeText ? meta.badgeText.replace(/^[^\s]+\s*/, '') : 'عادی';
        rows += `<tr>
            <td style="text-align:center;">${i + 1}</td>
            <td style="mso-number-format:'\@';">${c.code || ''}</td>
            <td><strong>${c.name || ''}</strong></td>
            <td>${c.city || ''}</td>
            <td style="direction:ltr;text-align:left;mso-number-format:'\@';">${c.phone || ''}</td>
            <td>${c.sender || 'تعیین‌نشده'}</td>
            <td style="background:${meta.excelBg};color:${meta.excelColor};font-weight:bold;text-align:center;">${statusText}</td>
            <td>${c.note || ''}</td>
        </tr>`;
    });
    const excelHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:Tahoma;} th,td{border:1px solid #334155;padding:6px 10px;} th{background:#0284c7;color:#ffffff;}</style></head>
    <body dir="rtl">
        <h3>لیست کامل مخاطبین مشتریان گروه بازرگانی CHF (${sorted.length} مخاطب - مرتب‌شده بر اساس حروف الفبا)</h3>
        <table>
            <thead><tr><th>ردیف</th><th>کد مشتری</th><th>نام مشتری</th><th>شهر</th><th>شماره تماس</th><th>فرستنده</th><th>وضعیت حساب</th><th>یادداشت</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    </body></html>`;
    try {
        const blob = new Blob(['\uFEFF' + excelHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'CHF_Customers_Contacts.xls';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        addLog('دریافت فایل اکسل مخاطبین مشتریان CHF');
    } catch (e) {
        copyAllCustomersText();
    }
}




function buildAllCustomersPlainText() {
    const sorted = sortCustomersAlphabetically(state.customers);
    const lines = [
        `📋 لیست کامل مخاطبین مشتریان گروه بازرگانی CHF (${sorted.length} مخاطب):`,
        '----------------------------------------'
    ];
    sorted.forEach((c, i) => {
        const meta = getCustomerColorMeta(c.accountColor);
        const parts = [
            `${i + 1}) ${c.name || ''}`,
            c.city || '',
            c.phone || 'بدون شماره'
        ];
        if (c.sender) parts.push(`فرستنده: ${c.sender}`);
        if (meta.badgeText) parts.push(`وضعیت: ${meta.badgeText}`);
        if (c.note) parts.push(`یادداشت: ${c.note}`);
        lines.push(parts.join(' | '));
    });
    return lines.join('\n');
}

            <p style="color:#94a3b8;font-size:11px;margin-bottom:10px;">متن زیر آماده است؛ دکمه کپی را بزنید یا مستقیماً اشتراک‌گذاری کنید:</p>
            <textarea id="all-cust-copy-ta" readonly style="width:100%;height:190px;background:#020617;color:#f8fafc;font-family:Tahoma;font-size:11px;padding:8px;border:1px solid #334155;border-radius:8px;margin-bottom:10px;line-height:1.7;">${txt}</textarea>

                <button onclick="if(navigator.share){navigator.share({title:'مخاطبین CHF',text:document.getElementById('all-cust-copy-ta').value}).catch(()=>{});}" style="flex:1;background:#38bdf8;color:#000;border:none;padding:9px;border-radius:8px;font-weight:bold;font-size:12px;cursor:pointer;">📤 ارسال / اشتراک</button>
            </div>
            <button onclick="this.parentElement.parentElement.remove()" style="width:100%;background:transparent;border:1px solid #ef4444;color:#ef4444;padding:7px;border-radius:8px;font-size:11px;cursor:pointer;">بستن</button>
        </div>
    `;
    document.body.appendChild(overlay);
    const ta = document.getElementById('all-cust-copy-ta');
    if (ta) { ta.focus(); ta.select(); }
}




function copyAllCustomersText() {
    const txt = buildAllCustomersPlainText();
    const totalCount = state.customers.length;




    const fallbackTextareaCopy = () => {
        try {
            const ta = document.createElement('textarea');
            ta.value = txt;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '0';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, 999999);
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok) {
                alert(`✅ متن کامل تمامی ${totalCount} مخاطب با موفقیت کپی شد!`);
                return true;
            }
        } catch (_) {}
        return false;
    };




    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt)
            .then(() => {
                alert(`✅ متن کامل تمامی ${totalCount} مخاطب با موفقیت کپی شد!`);
            })
            .catch(() => {
                if (!fallbackTextareaCopy()) {
                    showFallbackCopyModal(txt, totalCount);
                }
            });
    } else {
        if (!fallbackTextareaCopy()) {
            showFallbackCopyModal(txt, totalCount);
        }
    }
}
